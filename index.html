<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Theme before the first paint (no flash); src/prefs keeps it up to date.
      try { document.documentElement.dataset.theme = localStorage.getItem("nts-theme") === "light" ? "light" : "dark"; } catch (e) { document.documentElement.dataset.theme = "dark"; }
    </script>
    <!-- New file names (not favicon.*) so browsers can't show a cached old icon. -->
    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-icon-32.png?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <link rel="apple-touch-icon" href="/logo-icon-180.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taal Studio · Nederlands op jouw niveau</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
