<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Theme before the first paint (no flash); src/prefs keeps it up to date.
      try { document.documentElement.dataset.theme = localStorage.getItem("nts-theme") === "light" ? "light" : "dark"; } catch (e) { document.documentElement.dataset.theme = "dark"; }
    </script>
    <!-- New file names (not favicon.*) so browsers can't show a cached old icon. -->
    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-icon-32.png?v=4" />
    <link rel="shortcut icon" href="/favicon.ico?v=4" />
    <link rel="apple-touch-icon" href="/logo-icon-180.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taal Studio · Nederlands op jouw niveau</title>
    <meta
      name="description"
      content="Nederlands leren op jouw niveau (A0–B2): je eigen leerpad, heldere uitleg, oefeningen en flashcards. NT2-lessen in Rotterdam en online."
    />
    <link rel="canonical" href="https://mijntaalstudio.nl/" />
    <meta name="theme-color" content="#0f1115" />

    <!-- Link previews (WhatsApp, LinkedIn, Facebook, X). The image is made in demo/remotion/Og.jsx. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Taal Studio" />
    <meta property="og:locale" content="nl_NL" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:url" content="https://mijntaalstudio.nl/" />
    <meta property="og:title" content="Taal Studio · Nederlands op jouw niveau" />
    <meta
      property="og:description"
      content="Je eigen leerpad, heldere uitleg, oefeningen en flashcards. Nederlands leren van A0 tot B2, met NT2-lessen in Rotterdam en online."
    />
    <meta property="og:image" content="https://mijntaalstudio.nl/og-image.jpg?v=1" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Taal Studio: Nederlands op jouw niveau, met een leerpad in de app" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Taal Studio · Nederlands op jouw niveau" />

</html>
