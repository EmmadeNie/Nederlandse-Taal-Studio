name: Supabase migrations

# Pull requests: check that all migrations apply cleanly on a fresh database.
# Push to main: apply new migrations to the hosted Supabase project.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   database password of the hosted project
#   SUPABASE_PROJECT_ID    project ref, e.g. lgmzoihdwgkboixrylkd

on:
  pull_request:
    paths:
      - "supabase/**"
  push:
    branches: [main]
    paths:
      - "supabase/**"
  workflow_dispatch:

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Apply migrations to a fresh local database
        run: supabase db start

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
      - name: Show pending migrations
        run: supabase migration list
      - name: Push migrations
        run: supabase db push
